name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: LanBoard.Web/package-lock.json

      - name: Restore
        run: dotnet restore LanBoard.slnx

      - name: Build
        run: dotnet build LanBoard.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LanBoard.slnx --configuration Release --no-build
