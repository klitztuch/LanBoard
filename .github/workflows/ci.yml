name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: LanBoard.Web/package-lock.json

      - name: Restore
        run: dotnet restore LanBoard.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build LanBoard.slnx --configuration Release --no-restore

      # Uses the design-time AppDbContextFactory: no database or Steam API key needed.
      - name: Check for pending EF model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project LanBoard.Infrastructure
          --startup-project LanBoard.Web
          --configuration Release
          --no-build

      - name: Test
        run: dotnet test LanBoard.slnx --configuration Release --no-build
